name: ecowallet
description: "Um aplicativo bancário voltado para sustentabilidade e ESG."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  get_it: ^8.3.0
  fl_chart: ^1.1.0
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  flutter_local_notifications: ^19.5.0
  notification_listener_service: ^1.0.0
  timezone: ^0.10.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.5
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true