openapi: 3.0.3
info:
  title: EcoWallet Dashboard API
  version: 0.1.0
  description: API do Dashboard Administrativo B2B (métricas de carbono por empresa).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness
      security: []
      responses:
        "200":
          description: OK
  /v1/companies/{id}/carbon/summary:
    get:
      summary: Resumo agregado de carbono da empresa
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarbonSummary"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/companies/{id}/carbon/timeseries:
    get:
      summary: Série mensal de emissões e mitigação
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Série temporal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeseries"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Firebase ID token (em dev, "dev-<companyId>").
  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      schema: { type: string }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    CarbonSummary:
      type: object
      required: [company_id, total_balance, total_co2e_kg, co2_saved_kg, trees_equivalent, active_users, factor_version]
      properties:
        company_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total_balance: { type: number }
        total_co2e_kg: { type: number }
        co2_saved_kg: { type: number }
        trees_equivalent: { type: integer }
        active_users: { type: integer }
        factor_version: { type: string }
    Timeseries:
      type: object
      properties:
        company_id: { type: string }
        points:
          type: array
          items:
            type: object
            properties:
              period: { type: string, example: "2026-10" }
              emitted_kg: { type: number }
              mitigated_kg: { type: number }
